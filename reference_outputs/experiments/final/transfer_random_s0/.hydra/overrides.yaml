- sgd_momentum=0.9
- compress_lr=0.01
- n_epochs_compress=120
- ewc_lambda=500
- fisher_clip=0.01
- gamma=0.99
- tau=2
- normalize_fisher=false
- data_augmentation=true
- kb_random=true
- seed=0
