- max_n_tasks=10
- multi_head=true
- reinit=true
- compress_teacher=frozen_teacher
- eval_epochs_progress=[25,50,100,200,400]
- progress_optimizer=adam
- progress_lr=1e-3
- n_epochs_progress=400
