- max_n_tasks=10
- multi_head=true
- reinit=true
- compress_teacher=frozen_teacher
- progress_optimizer=adam
- progress_lr=1e-3
- n_epochs_progress=400
- compress_optimizer=sgd
- sgd_momentum=0.9
- compress_lr=0.01
- n_epochs_compress=120
- ewc_lambda=0
- fisher_clip=0.01
- gamma=0.99
- tau=2
- normalize_fisher=false
- data_augmentation=true
- seed=2
