seed: 2
device: auto
batch_size: 32
max_n_tasks: 10
dataset: omniglot
data_root: ./data
use_batchnorm: false
adaptor_init: uniform
progress_optimizer: adam
compress_optimizer: sgd
sgd_momentum: 0.9
progress_lr: 0.001
compress_lr: 0.01
n_epochs_progress: 400
eval_every_progress: 5
reinit: true
copy_kb_parameters: false
n_epochs_compress: 120
eval_every_compress: 5
compress_head_warmup: 0
gamma: 0.99
ewc_lambda: 0
tau: 2
max_n_samples: null
normalize_fisher: false
fisher_clip: 0.01
compress_teacher: frozen_teacher
multi_head: true
data_augmentation: true
