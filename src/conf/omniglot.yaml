# Progress & Compress on Omniglot (src/run_omniglot.py). Flat keys, overridable on the command line.
seed: 0
device: auto          # auto | cuda | mps | cpu

max_n_tasks: 3
data_root: ./data

# Model
use_batchnorm: false
adaptor_init: uniform  # uniform | gaussian

# Optimizer
progress_optimizer: adam         # adam | sgd (progress phase)
compress_optimizer: adam  # adam | sgd (compress phase)
sgd_momentum: 0.9 # SGD momentum, in both phases where sgd is chosen
progress_lr: 1e-3
compress_lr: 5e-4

# Progress phase
n_epochs_progress: 50
eval_every_progress: 5
eval_epochs_progress: []  # list of int. Also evaluate after these completed epochs (1 = the first), e.g. [25,50,100,200,400]. eval_every_progress counts loop indices 0, 5, ... (after epochs 1, 6, ...).
reinit: true
copy_kb_parameters: false
kb_random: false  # bool. true = the E7 control: the active column reads the frozen random KB of model construction; no compress, no Fisher.

# Compress phase
n_epochs_compress: 60
eval_every_compress: 5
compress_head_warmup: 0  # int. Train only the KB linear head for the first N compress epochs (multi-head starts from a random head).

# EWC / distillation
gamma: 0.99
ewc_lambda: 15.0
tau: 2.0
max_n_samples: null
normalize_fisher: true
fisher_clip: null  # null | float. Clip each diagonal Fisher entry at this value before the running sum.

# Teacher mode for compress phase
# frozen_teacher   = paper-correct: teacher uses adaptors fed by frozen KB snapshot
# moving_teacher   = teacher uses adaptors with live (training) KB features
# only_active_teacher = teacher is active backbone alone, no adaptors (my first reading of the paper)
compress_teacher: frozen_teacher
multi_head: false
data_augmentation: true
