[project]
name = "progress-compress"
version = "0.1.0"
description = "Progress & Compress (Schwarz et al., 2018) continual learning on Omniglot and Atari"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.24.0",
    "numpy>=2.2.5",
    "matplotlib",
    "scikit-learn>=1.5.0",
    "tqdm>=4.67.3",
    "hydra-core>=1.3.0",
]

[project.optional-dependencies]
atari = [
    "ale-py>=0.10",
    "envpool>=1.2.0",
    "gymnasium>=1.0",
    "tensorboard>=2.21.0",
    "tyro>=1.0.16",
    "wandb>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]  # the modules import each other as `from model import ...`
